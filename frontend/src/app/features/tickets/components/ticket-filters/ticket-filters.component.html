<section
  aria-label="Ticket filters"
  class="mt-4 grid gap-4 sm:grid-cols-2 lg:grid-cols-[1fr_1fr_1.1fr_auto_auto] lg:items-end"
>
  <label class="grid gap-1.5 text-xs font-medium text-neutral-300">
    <span>Status</span>
    <select
      #statusSelect
      class="h-11 rounded-lg border border-neutral-700 bg-neutral-950/60 px-3 text-sm font-normal text-neutral-100 outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20"
      [value]="status ?? ''"
      (change)="onStatusChange(statusSelect.value)"
    >
      <option value="">All statuses</option>
      @for (option of statuses; track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
  </label>

  <label class="grid gap-1.5 text-xs font-medium text-neutral-300">
    <span>Priority</span>
    <select
      #prioritySelect
      class="h-11 rounded-lg border border-neutral-700 bg-neutral-950/60 px-3 text-sm font-normal text-neutral-100 outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20"
      [value]="priority ?? ''"
      (change)="onPriorityChange(prioritySelect.value)"
    >
      <option value="">All priorities</option>
      @for (option of priorities; track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
  </label>

  <label class="grid gap-1.5 text-xs font-medium text-neutral-300">
    <span>Agent</span>
    <select
      #agentSelect
      class="h-11 rounded-lg border border-neutral-700 bg-neutral-950/60 px-3 text-sm font-normal text-neutral-100 outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20"
      [value]="assignedAgentId ?? ''"
      (change)="onAgentChange(agentSelect.value)"
    >
      <option value="">All agents</option>
      @for (agent of agents$ | async; track agent.id) {
        <option [value]="agent.id">{{ agent.fullName }}</option>
      }
    </select>
  </label>

  <label class="flex h-11 items-center gap-2 rounded-lg px-1 text-sm text-neutral-300">
    <input
      #overdueCheckbox
      type="checkbox"
      class="h-4 w-4 rounded border-neutral-700 bg-neutral-950 text-sky-500 focus:ring-sky-500/30"
      [checked]="overdueOnly"
      (change)="overdueOnlyChange.emit(overdueCheckbox.checked)"
    />
    Overdue only
  </label>

  <div class="flex">
    <button
      type="button"
      class="h-11 w-full rounded-lg border border-neutral-700 px-4 text-sm font-medium text-neutral-200 transition-colors hover:border-neutral-600 hover:bg-neutral-800 focus:outline-none focus:ring-2 focus:ring-neutral-600/40"
      (click)="clearFilters.emit()"
    >
      Clear filters
    </button>
  </div>
</section>
